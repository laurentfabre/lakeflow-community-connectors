[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-crm-analytics"
version = "0.1.0"
description = "Version-pinned Salesforce CRM Analytics dataset snapshots"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0,<3.0",
    "lakeflow-community-connectors>=0.1.0,<1.0",
]

[project.optional-dependencies]
dev = ["pyspark>=4.2.0.dev0,<5.0", "pytest>=7.0.0,<9.0"]

[tool.setuptools]
include-package-data = false
packages = ["databricks.labs.community_connector.sources.crm_analytics"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.crm_analytics" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
"databricks.labs.community_connector.sources.crm_analytics" = ["docs/*.md"]
